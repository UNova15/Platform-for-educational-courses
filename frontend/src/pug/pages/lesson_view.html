<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
    <title>Урок | Platform</title>
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <a class="logo" href="/index.html"
          ><img
            class="logo__img"
            src="/assets/ipeg/logo2.jpg"
            alt="Логотип Platform"
        /></a>
        <div class="header-right">
          <div class="search-wrapper">
            <form class="search-form" action="/search" method="GET">
              <input
                class="search-input"
                type="text"
                name="query"
                placeholder=""
              /><button class="search-btn" type="submit" aria-label="Поиск">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </button>
            </form>
          </div>
          <div class="header-divider"></div>
          <a class="btn__profile-btn" id="profileBtn" href="#" type="button"
            ><svg
              class="profile-icon"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle></svg
            ><span>Профиль</span></a
          >
        </div>
      </div>
    </header>
    <main class="lesson-view-page">
      <div class="lesson-view-container">
        <a class="lesson-view__back" href="javascript:history.back()"
          >← Назад</a
        >
        <h1 class="lesson-view__title" id="lessonTitle">Загрузка...</h1>
        <div class="lesson-view__content" id="lessonContent"></div>
        <div class="lesson-view__loading" id="lessonLoading">Загрузка...</div>
        <div class="lesson-view__error" id="lessonError" hidden>
          Не удалось загрузить урок
        </div>
      </div>
    </main>
    <script type="module" src="js/main.min.js"></script>
  </body>
</html>
