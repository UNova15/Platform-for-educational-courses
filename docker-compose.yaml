x-migrations-base: &migration-base
  build:
    context: ./backend
    dockerfile: migration.Dockerfile
  depends_on:
    database:
      condition: service_healthy

services:
  backend:
    container_name: kira-backend
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      JWT_KEY: ${JWT_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      ACCESS_TOKEN_TTL: "20m"
      REFRESH_TOKEN_LENGTH: "64"
      COOKIE_TTL: "10d"
    ports:
      - "8080:8080"
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      migrate-course:
        condition: service_completed_successfully
      migrate-progress:
        condition: service_completed_successfully



  migrate-auth:
    <<: *migration-base
    container_name: kira-migrate-auth
    command:
      - "-url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
      - "-user=${DB_USER}"
      - "-password=${DB_PASSWORD}"
      - "-schemas=auth"
      - "-locations=filesystem:/flyway/sql/auth"
      - "migrate"

  migrate-course:
    <<: *migration-base
    container_name: kira-migrate-course
    command:
      - "-url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
      - "-user=${DB_USER}"
      - "-password=${DB_PASSWORD}"
      - "-schemas=course"
      - "-locations=filesystem:/flyway/sql/course"
      - "migrate"

  migrate-progress:
    <<: *migration-base
    container_name: kira-migrate-progress
    command:
      - "-url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
      - "-user=${DB_USER}"
      - "-password=${DB_PASSWORD}"
      - "-schemas=progress"
      - "-locations=filesystem:/flyway/sql/progress"
      - "migrate"

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile

  database:
    container_name: kira-db
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432" ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s


  ingress-balancer:
    container_name: balancer
    image: nginx:1.31.1
    ports:
      - "80:80"
    environment:
      FRONTEND_HOST: frontend
      BACKEND_HOST: backend
      FRONTEND_PORT: 80
      BACKEND_PORT: 8080
    depends_on:
      - backend
      - frontend
    volumes:
      - ./deploy/local/balancer.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  pg_data:

