spring:
  application:
    name: Kira

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:pass}

  config:
    import:
      - optional:classpath:application-infrastructure.yaml
      - optional:classpath:application-auth.yaml

server:
  servlet:
    context-path: /api

logging:
  structured:
    format:
      console: ecs
