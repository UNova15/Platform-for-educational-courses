spring:
  application:
    name: Kira

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver

  config:
    import:
      - optional:classpath:application-infrastructure.yaml
      - optional:classpath:application-auth.yaml
      - optional:classpath:application-course.yaml
      - optional:classpath:application-progress.yaml

  flyway:
    enabled: false

server:
  servlet:
    context-path: /api

logging:
  structured:
    format:
      console: ecs
