spring:
  application:
    name: Platform-for-educational-courses

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  servlet:
    context-path: /api

app:
  security:
    key: ${JWT_KEY}
    jwt-ttl: 1h
    refresh-ttl: 2d

    min-password-length: 8



