name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches:
      - dev
      - master
    paths:
      - 'frontend/**'

defaults:
  run:
    working-directory: ./frontend

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройка Node.js и кэширования NPM
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка фронтенда
        run: npm run build

      - name: Сохранение артефактов
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  lint-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Установка зависимостей
        run: npm ci

      - name: Запуск линтеров
        run: npm run lint

  test-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Установка зависимостей
        run: npm ci

      - name: Запуск тестов
        run: npm run test