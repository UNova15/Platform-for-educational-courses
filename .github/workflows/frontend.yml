name: Frontend CI

on:
  pull_request:

  push:
    branches: [ dev,master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: ./frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'


  frontend-ci:
    runs-on: ubuntu-22.04
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and caching NPM
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Download dependencies
        run: npm ci

      - name: Check linters
        run: npm run check

      #      - name: Run tests
      #        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

