name: Backend CI

on:
  pull_request:

  push:
    branches: [ dev,master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

  workflow_dispatch:

defaults:
  run:
    working-directory: ./backend

jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'
  
  backend-ci:
    runs-on: ubuntu-22.04
    needs: changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: "backend/pom.xml"

      - name: Check linters
        run: mvn -B clean compile -am spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check

      - name: Build and verify
        run: mvn -B verify

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts
          path: backend/**/target/*.jar
          retention-days: 1
          if-no-files-found: error