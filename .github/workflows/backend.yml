name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches:
      - dev
      - master
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: ./backend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Настройка Java и кэширования Maven
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Сборка бэкенда
        run: mvn package -DskipTests

      - name: Сохранение артефактов
        uses: actions/upload-artifact@v4
        with:
          name: backend-target
          path: backend/target/
          retention-days: 1

  lint-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          name: backend-target
          path: backend/target/

      - name: Запуск линтеров
        run: mvn spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          name: backend-target
          path: backend/target/

      - name: Запуск тестов
        run: mvn verify