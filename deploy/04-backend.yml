apiVersion: apps/v1
kind: Deployment
metadata:
  name: kira-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kira-backend
  template:
    metadata:
      labels:
        app: kira-backend
    spec:
      containers:
        - name: kira-backend
          image: ghcr.io/unova15/kira-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: config
            - secretRef:
                name: secret-data

  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
